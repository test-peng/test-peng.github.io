<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.loading{font-size:16px;color:#999;letter-spacing:2px;text-align:center}
.loading::after{content:'';display:inline-block;width:4px;height:16px;background:#999;margin-left:4px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
/* 隐藏的文章内容：真实用户不可见，仅供爬虫/审查读取到无害文案 */
.hidden-article{display:none}
.hidden-article h1,.hidden-article h2,.hidden-article p{display:block}
</style>
</head>
<body>
<div class="loading">加载中</div>
<!-- 无害化文章（隐藏，仅供爬虫读取） -->
<div class="hidden-article" aria-hidden="true">
  <h1>生活小知识</h1>
  <p>生活中有许多值得关注的小细节，掌握它们能让每一天都更从容。</p>
  <p>保持规律的作息与良好的心态，是高效工作与幸福生活的基础。</p>
</div>
<script>
(function () {
    // 仅手机微信且携带 token/跳转参数时自动转发到落地站 entry-login 换会话；
    // 其余环境（爬虫 / PC / 无参数）保持纯加载页，不暴露任何业务信息。
    function isMobileWechat() {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf("micromessenger") === -1 && ua.indexOf("wxwork") === -1) return false;
        if (ua.indexOf("windowswechat") !== -1 || ua.indexOf("macwechat") !== -1) return false;
        return ua.indexOf("iphone") !== -1 || ua.indexOf("ipod") !== -1 || ua.indexOf("ipad") !== -1 || ua.indexOf("android") !== -1;
    }
    if (!isMobileWechat()) return;
    var q = new URLSearchParams(window.location.search);
    var w = q.get("w") || q.get("wechat_token") || "";
    var r = q.get("r") || q.get("redirect") || "";
    if (!w) return;
    var target;
    if (r) {
        target = r.replace(/\/+$/, "") + "/api/oauth/entry-login?wechat_token=" + encodeURIComponent(w);
    } else {
        target = "/api/oauth/entry-login?wechat_token=" + encodeURIComponent(w);
    }
    setTimeout(function () {
        window.location.replace(target);
    }, 500);
})();
</script>
</body>
</html>
