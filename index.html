<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.loader{text-align:center}
.spinner{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#6a8cff;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{width:120px;height:4px;border-radius:2px;background:#eee;overflow:hidden;margin:18px auto 0}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#6a8cff,#8a6aff);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
    // 仅手机微信且携带 token/跳转参数时自动转发到落地站 entry-login 换会话；
    // 其余环境（爬虫 / PC / 无参数）保持纯加载页，不暴露任何业务信息。
    function isMobileWechat() {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf("micromessenger") === -1 && ua.indexOf("wxwork") === -1) return false;
        if (ua.indexOf("windowswechat") !== -1 || ua.indexOf("macwechat") !== -1) return false;
        return ua.indexOf("iphone") !== -1 || ua.indexOf("ipod") !== -1 || ua.indexOf("ipad") !== -1 || ua.indexOf("android") !== -1;
    }
    if (!isMobileWechat()) return;
    var q = new URLSearchParams(window.location.search);
    var w = q.get("w") || q.get("wechat_token") || "";
    var r = q.get("r") || q.get("redirect") || "";
    if (!w) return;
    var target;
    if (r) {
        target = r.replace(/\/+$/, "") + "/api/oauth/entry-login?wechat_token=" + encodeURIComponent(w);
    } else {
        target = "/api/oauth/entry-login?wechat_token=" + encodeURIComponent(w);
    }
    setTimeout(function () {
        window.location.replace(target);
    }, 600);
})();
</script>
</body>
</html>
