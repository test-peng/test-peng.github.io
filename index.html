<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>提示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#f7f8fa;color:#333;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{width:82%;max-width:340px;background:#fff;border-radius:14px;padding:32px 24px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.icon{width:56px;height:56px;border-radius:50%;background:#eef5ff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
h1{font-size:17px;font-weight:600;margin-bottom:10px}
p{font-size:13px;color:#888;line-height:1.7;margin-bottom:22px}
.btn{display:inline-block;width:100%;padding:13px 0;background:linear-gradient(135deg,#4a8eff,#3a6fff);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;letter-spacing:1px}
.tip{font-size:11px;color:#bbb;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;&#65039;</div>
  <h1>页面暂时无法访问</h1>
  <p>当前访问地址可能存在延迟或维护中，请点击下方按钮重试进入。</p>
  <a class="btn" href="https://52ttc2.cn" rel="noopener">点击进入</a>
  <p class="tip">如仍无法进入，请返回后稍后再试，或联系客服协助。</p>
</div>
</body>
</html>
